plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")

if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream {
        localProperties.load(it)
    }
}

def geminiApiKey = localProperties.getProperty("GEMINI_API_KEY", "")

android {
    namespace 'com.nova.agent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nova.agent'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3'
    }

    buildTypes {
        debug {
            minifyEnabled false
            buildConfigField "String", "GEMINI_API_KEY", "\"${geminiApiKey.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        }

        release {
            minifyEnabled false
            buildConfigField "String", "GEMINI_API_KEY", "\"\""
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
